name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin manifests and skills
        run: ./scripts/validate.sh
      - name: Test build and installation plumbing
        run: ./scripts/test-installation.sh
